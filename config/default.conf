# xcc-fan-controller defaults for the tested Lenovo ThinkSystem SR650 V1.
# This is sourced as Zsh code. Only use trusted, root-controlled configuration.
# cfg is declared local and associative by run_controller.

cfg=(
    poll_interval       3
    ipmi_timeout        10
    cpu_low_below       30
    cpu_low_return      27
    cpu_limit           60
    dimm_limit          60
    pch_limit           60
    ambient_limit       38
    exhaust_limit       50
    safety_hysteresis   5
    cpu1_count          1
    cpu2_count          1
    dimm_count          12
    pch_count           1
    ambient_count       1
    exhaust_count       1
    overtemp_count      10
)

ipmi_command=(ipmitool -I open)
low_command=(raw 0x3a 0x07 0xff 0x56 0x01)
medium_command=(raw 0x3a 0x07 0xff 0x8a 0x01)
auto_command=(raw 0x3a 0x07 0xff 0xff 0x00)
